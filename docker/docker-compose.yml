# Nombre de proyecto propio: los contenedores y la red quedan con prefijo `patchmonitor-`,
# sin colisionar con un stack de ReleaseOrderDemo levantado en la misma máquina (spec 09).
name: patchmonitor

services:
  temporal:
    image: temporalio/auto-setup:1.23.0
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgresql
      DBNAME: temporal
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_NAME: temporal
      POSTGRES_SEEDS: temporal-db
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    ports:
      - "7234:7233"   # externo 7234 → interno 7233 (ReleaseOrderDemo publica 7233)
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    # auto-setup deja el contenedor "arriba" decenas de segundos antes de que el
    # frontend acepte conexiones. Sin esto, patch-monitor-worker conecta al arranque,
    # el bridge nativo de Temporalio recibe "connection refused" y mata el proceso
    # (exit 139); WorkerHost.ConnectAsync no reintenta. El healthcheck + depends_on
    # condition: service_healthy hace que worker y API esperen a que Temporal responda.
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "workflow", "list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  temporal-db:
    image: postgres:15
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5433:5432"   # externo 5433 → interno 5432 (ReleaseOrderDemo publica 5432)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - temporal_data:/var/lib/postgresql/data

  temporal-ui:
    image: temporalio/ui:2.23.0
    depends_on:
      - temporal
    ports:
      - "8234:8080"   # externo 8234 → interno 8080 (ReleaseOrderDemo publica 8233)
    environment:
      TEMPORAL_ADDRESS: temporal:7233

  patch-monitor-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.PatchMonitor
    # Mayor que el GracefulShutdownTimeout (30s) de WorkerHost para que Docker deje drenar
    # las Activities en vuelo antes de mandar SIGKILL.
    stop_grace_period: 45s
    environment:
      - TEMPORAL_HOST=temporal:7233
      - MONITOR_TASK_QUEUE=patch-monitor-task-queue
      - TARGET_TEMPORAL_HOST=temporal:7233
      - TARGET_TEMPORAL_NAMESPACE=default
      # Descubrimiento en dos niveles (spec 03). Topes por corrida y ventana de cerradas.
      - DISCOVERY_LOOKBACK_DAYS=7
      - DISCOVERY_MAX_EXECUTIONS=500
      - DISCOVERY_MAX_HISTORIES=200
      # Resolución de fase (spec 04). Horas que una ejecución sin marker debe superar al
      # último marker para leerse como fase 3 (código limpio).
      - PHASE_CLEAN_GRACE_HOURS=24
    depends_on:
      temporal:
        condition: service_healthy

  monitor-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.MonitorApi
    ports:
      - "5100:5100"
    environment:
      - TEMPORAL_HOST=temporal:7233
      - MONITOR_TASK_QUEUE=patch-monitor-task-queue
      - TARGET_TEMPORAL_HOST=temporal:7233
      - TARGET_TEMPORAL_NAMESPACE=default
    depends_on:
      temporal:
        condition: service_healthy

volumes:
  temporal_data:
