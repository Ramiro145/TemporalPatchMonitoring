server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Rutas de React Router: cualquier path que no sea un archivo real cae en index.html.
    location / {
        try_files $uri /index.html;
    }

    # Mismo origen que el front (:80) => CORS no entra en juego en este camino.
    location /api/ {
        proxy_pass http://monitor-api:5100/;
    }
}
