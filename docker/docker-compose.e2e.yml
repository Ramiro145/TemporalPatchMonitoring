# Overlay para el spec 09: acorta las ventanas de fase y descubrimiento para que el monitor
# vea los saltos de fase de ReleaseOrderDemo sin esperar los tiempos de producción. Apuntar al
# cluster existente (host.docker.internal:7233, namespace `monitor` propio / `default`
# observado) ya es el default del compose base desde el spec 12; este overlay solo ajusta lo
# que de verdad lo distingue.
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d
services:
  patch-monitor-worker:
    environment:
      - PHASE_CLEAN_GRACE_MINUTES=3
      - PHASE_CLEAN_CONFIDENCE=0.95
      - DISCOVERY_LOOKBACK_DAYS=1
